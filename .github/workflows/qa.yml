name: Lucem QA Lab
on:
  pull_request:
  push:
    branches: [feature/lucem-ui-redesign-v1]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lucem_qa
          POSTGRES_USER: lucem_qa
          POSTGRES_PASSWORD: qa-only-ci-password-not-for-staging
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U lucem_qa -d lucem_qa"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      QA_BASE_SHA: ${{ github.event.before }}
      QA_DATABASE_URL: postgresql://lucem_qa:qa-only-ci-password-not-for-staging@127.0.0.1:55433/lucem_qa?schema=public
      DATABASE_URL: postgresql://lucem_qa:qa-only-ci-password-not-for-staging@127.0.0.1:55433/lucem_qa?schema=public
      QA_POSTGRES_PASSWORD: qa-only-ci-password-not-for-staging
      E2E_ADMIN_PASSWORD: QA-CI-Admin-Password-2026
      E2E_SELLER_PASSWORD: QA-CI-Seller-Password-2026
      E2E_INVENTORY_PASSWORD: QA-CI-Inventory-Password-2026
      QA_ADMIN_PASSWORD: QA-CI-Admin-Password-2026
      QA_SELLER_PASSWORD: QA-CI-Seller-Password-2026
      QA_INVENTORY_PASSWORD: QA-CI-Inventory-Password-2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx lucem-audit --quick --changed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lucem-qa-quick-${{ github.sha }}
          path: |
            qa/reports/*.zip
            qa/reports/*.zip.sha256
          if-no-files-found: warn
          retention-days: 14

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'qa-full')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lucem_qa
          POSTGRES_USER: lucem_qa
          POSTGRES_PASSWORD: qa-only-ci-password-not-for-staging
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U lucem_qa -d lucem_qa"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      QA_BASE_SHA: ${{ github.event.before }}
      QA_DATABASE_URL: postgresql://lucem_qa:qa-only-ci-password-not-for-staging@127.0.0.1:55433/lucem_qa?schema=public
      DATABASE_URL: postgresql://lucem_qa:qa-only-ci-password-not-for-staging@127.0.0.1:55433/lucem_qa?schema=public
      QA_POSTGRES_PASSWORD: qa-only-ci-password-not-for-staging
      E2E_ADMIN_PASSWORD: QA-CI-Admin-Password-2026
      E2E_SELLER_PASSWORD: QA-CI-Seller-Password-2026
      E2E_INVENTORY_PASSWORD: QA-CI-Inventory-Password-2026
      QA_ADMIN_PASSWORD: QA-CI-Admin-Password-2026
      QA_SELLER_PASSWORD: QA-CI-Seller-Password-2026
      QA_INVENTORY_PASSWORD: QA-CI-Inventory-Password-2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx lucem-audit --full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lucem-qa-full-${{ github.sha }}
          path: |
            qa/reports/*.zip
            qa/reports/*.zip.sha256
          if-no-files-found: warn
          retention-days: 30
