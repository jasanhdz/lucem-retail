name: QA Lab
on:
  pull_request:
  push:
  schedule:
    - cron: '0 8 * * 1'
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/qa/lucem-audit.ts --coverage
  full:
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[qa-full]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/qa/lucem-audit.ts --full --functional --visual --accessibility --performance
