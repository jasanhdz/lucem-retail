<script>
  function selectCategory(selectedEl) {
    const cards = document.querySelectorAll('.category-card');
    cards.forEach(card => {
      // Reset card visual state
      card.classList.remove('bg-surface-container-lowest', 'shadow-md');
      card.classList.add('bg-surface-container-low', 'shadow-sm');
      
      const pill = card.querySelector('.selection-pill');
      if (pill) {
        pill.classList.add('hidden');
        pill.classList.remove('flex');
      }

      const iconBox = card.querySelector('.w-11');
      if (iconBox) {
        iconBox.classList.remove('text-secondary');
        iconBox.classList.add('text-on-surface-variant');
      }
    });

    // Apply active state
    selectedEl.classList.remove('bg-surface-container-low', 'shadow-sm');
    selectedEl.classList.add('bg-surface-container-lowest', 'shadow-md');

    const activePill = selectedEl.querySelector('.selection-pill');
    if (activePill) {
      activePill.classList.remove('hidden');
      activePill.classList.add('flex');
    }

    const activeIconBox = selectedEl.querySelector('.w-11');
    if (activeIconBox) {
      activeIconBox.classList.add('text-secondary');
      activeIconBox.classList.remove('text-on-surface-variant');
    }

    // Update bottom label
    const categoryName = selectedEl.getAttribute('data-category-name');
    const label = document.getElementById('selected-category-label');
    if (label && categoryName) {
      label.textContent = categoryName;
    }
  }

  function completeSetup() {
    const finishBtn = document.getElementById('finish-btn');
    if (!finishBtn) return;
    
    finishBtn.disabled = true;
    finishBtn.innerHTML = `
      <span class="inline-block animate-spin material-symbols-outlined text-[20px]">progress_activity</span>
      <span>Generando terminal POS...</span>
    `;

    setTimeout(() => {
      finishBtn.innerHTML = `
        <span class="material-symbols-outlined text-[20px]">check_circle</span>
        <span>¡Negocio creado con éxito!</span>
      `;
      finishBtn.classList.remove('bg-secondary');
      finishBtn.classList.add('bg-primary');
    }, 1200);
  }
</script></main>
