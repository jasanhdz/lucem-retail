<script>
  (function() {
    const pwInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm-password');
    const toggleBtn = document.getElementById('toggle-pw-btn');
    const pwIcon = document.getElementById('pw-icon');
    const matchStatus = document.getElementById('match-status');
    const matchIconContainer = document.getElementById('match-icon-container');
    const matchIcon = document.getElementById('match-icon');
    const bars = [
      document.getElementById('bar-1'),
      document.getElementById('bar-2'),
      document.getElementById('bar-3'),
      document.getElementById('bar-4')
    ];

    if (toggleBtn && pwInput && pwIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwInput.getAttribute('type') === 'password';
        pwInput.setAttribute('type', isPassword ? 'text' : 'password');
        pwIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (pwInput) {
      pwInput.addEventListener('input', () => {
        const val = pwInput.value;
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        bars.forEach((bar, index) => {
          if (!bar) return;
          bar.className = 'h-1 flex-1 rounded-full transition-colors';
          if (val.length === 0) {
            bar.classList.add('bg-surface-container');
          } else if (index < score) {
            if (score <= 1) bar.classList.add('bg-error');
            else if (score === 2) bar.classList.add('bg-tertiary-fixed-dim');
            else bar.classList.add('bg-secondary');
          } else {
            bar.classList.add('bg-surface-container');
          }
        });
        checkMatch();
      });
    }

    function checkMatch() {
      if (!confirmInput || !pwInput || !matchStatus || !matchIconContainer || !matchIcon) return;
      const val1 = pwInput.value;
      const val2 = confirmInput.value;

      if (!val2) {
        matchStatus.classList.add('hidden');
        matchIconContainer.classList.add('opacity-0');
        return;
      }

      matchStatus.classList.remove('hidden');
      matchIconContainer.classList.remove('opacity-0');

      if (val1 === val2 && val1.length >= 8) {
        matchStatus.textContent = 'Coinciden';
        matchStatus.className = 'font-body-sm text-body-sm text-secondary';
        matchIcon.textContent = 'check_circle';
        matchIcon.className = 'material-symbols-outlined text-secondary text-[20px]';
      } else {
        matchStatus.textContent = 'No coinciden';
        matchStatus.className = 'font-body-sm text-body-sm text-error';
        matchIcon.textContent = 'error';
        matchIcon.className = 'material-symbols-outlined text-error text-[20px]';
      }
    }

    if (confirmInput) {
      confirmInput.addEventListener('input', checkMatch);
    }
  })();
</script></main>
